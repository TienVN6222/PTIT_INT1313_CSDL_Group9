# ============================================================================
# pg_hba.conf - NFR-SEC-03: mọi kết nối qua mạng BẮT BUỘC dùng TLS
# ============================================================================
# TYPE      DATABASE  USER  ADDRESS        METHOD
# Socket nội bộ trong container (initdb, healthcheck pg_isready, psql qua docker exec).
local       all       all                  trust
# Kết nối qua mạng chỉ được chấp nhận khi đã mã hóa TLS, xác thực SCRAM-SHA-256.
hostssl     all       all   0.0.0.0/0      scram-sha-256
hostssl     all       all   ::/0           scram-sha-256
# Kết nối sao lưu nền (pg_basebackup, giao thức replication) cũng bắt buộc TLS.
hostssl     replication all 0.0.0.0/0      scram-sha-256
hostssl     replication all ::/0           scram-sha-256
# Kết nối qua mạng không mã hóa bị từ chối.
hostnossl   all       all   0.0.0.0/0      reject
hostnossl   all       all   ::/0           reject
hostnossl   replication all 0.0.0.0/0      reject
hostnossl   replication all ::/0           reject
