services:
  # ----------------------------------------------------------------------------
  # CƠ SỞ DỮ LIỆU POSTGRESQL 16 (Môi trường Disposable, tự động khởi tạo)
  # ----------------------------------------------------------------------------
  # NFR-SEC-03: image docker/postgres bật TLS (chứng chỉ tự ký cho demo) và pg_hba chỉ nhận
  # kết nối qua mạng đã mã hóa TLS; kết nối không mã hóa bị từ chối.
  db:
    build:
      context: ./docker/postgres
    image: fitzone-postgres:16
    container_name: fitzone_postgres_db
    restart: unless-stopped
    entrypoint: ["start-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym_management}
      POSTGRES_USER: ${POSTGRES_USER:-gym_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_password_2026}
      # NFR-AVL-01: lưu trữ WAL liên tục (mã hóa AES-256) vào ./backups/wal để khôi phục theo thời điểm.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-doi_mat_khau_sao_luu_khi_trien_khai}
      WAL_ARCHIVE_TIMEOUT: ${WAL_ARCHIVE_TIMEOUT:-300}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Tự động nạp theo thứ tự tên file: DDL -> Mock Data (8 file) -> Triggers/Views -> RBAC
      # (postgres chỉ chạy file nằm trực tiếp trong initdb.d nên mỗi file được mount riêng)
      - "./Phase 3/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql:ro"
      - "./Phase 3/02_mock_data/01_reference_data.sql:/docker-entrypoint-initdb.d/02_01_reference_data.sql:ro"
      - "./Phase 3/02_mock_data/02_users_and_profiles.sql:/docker-entrypoint-initdb.d/02_02_users_and_profiles.sql:ro"
      - "./Phase 3/02_mock_data/03_equipment.sql:/docker-entrypoint-initdb.d/02_03_equipment.sql:ro"
      - "./Phase 3/02_mock_data/04_subscriptions_and_billing.sql:/docker-entrypoint-initdb.d/02_04_subscriptions_and_billing.sql:ro"
      - "./Phase 3/02_mock_data/05_classes_and_enrollments.sql:/docker-entrypoint-initdb.d/02_05_classes_and_enrollments.sql:ro"
      - "./Phase 3/02_mock_data/06_pt_bookings.sql:/docker-entrypoint-initdb.d/02_06_pt_bookings.sql:ro"
      - "./Phase 3/02_mock_data/07_equipment_reservations.sql:/docker-entrypoint-initdb.d/02_07_equipment_reservations.sql:ro"
      - "./Phase 3/02_mock_data/08_maintenance_logs.sql:/docker-entrypoint-initdb.d/02_08_maintenance_logs.sql:ro"
      - "./Phase 3/04_triggers_views.sql:/docker-entrypoint-initdb.d/04_triggers_views.sql:ro"
      - "./Phase 3/08_rbac_security.sql:/docker-entrypoint-initdb.d/08_rbac_security.sql:ro"
      # Script kiểm thử chạy thủ công (KHÔNG chạy lúc khởi tạo), xem README
      - "./Phase 3:/sql:ro"
      # Kho WAL đã mã hóa (archive_command), dùng chung với service backup.
      - ./backups/wal:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym_admin} -d ${POSTGRES_DB:-gym_management}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - fitzone_network

  # ----------------------------------------------------------------------------
  # ỨNG DỤNG WEB GIAO DIỆN (STREAMLIT PYTHON)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fitzone_web_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gym_management}
      # Web đăng nhập bằng tài khoản KHÔNG phải superuser (nhóm quyền gym_role_admin, tạo ở 08_rbac_security.sql).
      # POSTGRES_USER chỉ dùng cho initdb (nạp schema/dữ liệu); không dùng cho ứng dụng.
      DB_USER: ${DB_USER:-gym_u_admin}
      DB_PASSWORD: ${DB_PASSWORD:-demo_2026}
      # NFR-SEC-03: kết nối CSDL bắt buộc mã hóa TLS.
      DB_SSLMODE: require
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
    networks:
      - fitzone_network

  # ----------------------------------------------------------------------------
  # BỘ LẬP LỊCH GIA HẠN HỢP ĐỒNG (BR-24)
  # Gọi thủ tục sp_process_subscription_renewals() ngay khi khởi động rồi lặp lại mỗi
  # RENEWAL_INTERVAL_SECONDS giây (mặc định 86400 = 1 ngày). Đăng nhập bằng tài khoản lễ tân
  # gym_u_reception (có EXECUTE thủ tục, không phải superuser). Môi trường production nên dùng
  # pg_cron hoặc cron của hệ điều hành thay cho container này.
  # ----------------------------------------------------------------------------
  scheduler:
    image: postgres:16-alpine
    container_name: fitzone_renewal_scheduler
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gym_management}
      PGUSER: ${SCHEDULER_DB_USER:-gym_u_reception}
      PGPASSWORD: ${SCHEDULER_DB_PASSWORD:-demo_2026}
      PGSSLMODE: require
      RENEWAL_INTERVAL_SECONDS: ${RENEWAL_INTERVAL_SECONDS:-86400}
      # BR-23: tác vụ định kỳ cũng phải gắn với người thực hiện (mặc định user 3 = lễ tân); trigger
      # trg_set_updated_by / trg_fill_created_by đọc biến phiên app.current_user_id này.
      PGOPTIONS: -c app.current_user_id=${SCHEDULER_ACTOR_USER_ID:-3}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$(date -u '+%Y-%m-%d %H:%M:%S') [scheduler] khởi động, chu kỳ $${RENEWAL_INTERVAL_SECONDS}s"
        until pg_isready -q; do sleep 2; done
        while true; do
          if psql -v ON_ERROR_STOP=1 -q -c "CALL sp_process_subscription_renewals();"; then
            echo "$$(date -u '+%Y-%m-%d %H:%M:%S') [scheduler] OK: CALL sp_process_subscription_renewals()"
          else
            echo "$$(date -u '+%Y-%m-%d %H:%M:%S') [scheduler] LỖI khi gọi sp_process_subscription_renewals(), thử lại ở chu kỳ sau"
          fi
          sleep "$${RENEWAL_INTERVAL_SECONDS}"
        done
    networks:
      - fitzone_network

  # ----------------------------------------------------------------------------
  # SAO LƯU ĐỊNH KỲ CÓ MÃ HÓA (NFR-AVL-01, NFR-SEC-03)
  # Mỗi BACKUP_INTERVAL_SECONDS giây (mặc định 1 ngày, chạy ngay khi khởi động): pg_dump -Fc và
  # pg_basebackup, mã hóa AES-256 bằng BACKUP_PASSPHRASE, lưu ở ./backups (giữ BACKUP_RETENTION bản).
  # Cùng kho WAL ./backups/wal (db lưu trữ liên tục) => khôi phục theo thời điểm (PITR).
  # Sao lưu ngay:          docker compose exec backup backup.sh --once
  # Kiểm tra khôi phục:     docker compose exec backup verify-restore.sh   (từ bản pg_dump)
  # Kiểm tra PITR:          docker compose exec backup verify-pitr.sh      (bản nền + phát lại WAL)
  # Dùng superuser vì pg_dump phải đọc được mọi bảng/cột (kể cả password_hash bị ẩn với role ứng dụng).
  # ----------------------------------------------------------------------------
  backup:
    build:
      context: ./docker/postgres
    image: fitzone-postgres:16
    container_name: fitzone_db_backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gym_management}
      PGUSER: ${POSTGRES_USER:-gym_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gym_password_2026}
      PGSSLMODE: require
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-doi_mat_khau_sao_luu_khi_trien_khai}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
    entrypoint: ["backup.sh"]
    volumes:
      - ./backups:/backups
      - ./backups/wal:/wal_archive
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fitzone_network

  # ----------------------------------------------------------------------------
  # PGADMIN 4 - GIAO DIỆN WEB XEM CSDL (cổng 5050)
  # Đăng nhập bằng PGADMIN_EMAIL / PGADMIN_PASSWORD; 3 kết nối tới db được khai báo sẵn trong
  # docker/pgadmin/servers.json (gym_admin, gym_u_admin, gym_u_reception), đều qua TLS (SSLMode require).
  # Mật khẩu CSDL nhập khi mở kết nối lần đầu (gym_admin: POSTGRES_PASSWORD; gym_u_*: demo_2026).
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: fitzone_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fitzone.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_g9_2026}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fitzone_network

networks:
  fitzone_network:
    driver: bridge

volumes:
  pgadmin_data:
